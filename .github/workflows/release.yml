name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libdbus-1-dev libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}

      - name: Package tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIR="ytmrs-${VERSION}-linux-x86_64"
          mkdir -p "$DIR/icons"
          cp target/release/ytmrs packaging/linux/ytmrs.desktop packaging/linux/install.sh README.md LICENSE "$DIR/"
          for f in assets/icons/hicolor/*.png; do cp "$f" "$DIR/icons/"; done
          tar czf "$DIR.tar.gz" "$DIR"

      - name: Package deb
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build --no-strip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ytmrs-*-linux-x86_64.tar.gz
            target/debian/*.deb
