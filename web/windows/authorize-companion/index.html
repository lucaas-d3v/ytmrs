<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>YtmRs - Companion Authorization</title>
    <link rel="stylesheet" href="/shared/app.css" />
    <link rel="stylesheet" href="/shared/titlebar.css" />
    <style>
      .container-wrapper { width: 100%; height: calc(100% - 36px); background-color: #000000; display: flex; align-items: center; justify-content: center; flex-direction: column; border-top: 1px solid #212121; }
      .container { padding: 8%; display: flex; align-items: center; justify-content: center; flex-direction: column; }
      .title, .subtitle, .code-confirm, .code { margin: unset; text-align: center; }
      .title { margin-bottom: 16px; font-size: 36px; }
      .subtitle { font-weight: normal; font-size: 20px; }
      .code-confirm { margin-top: 32px; font-size: 20px; }
      .code { margin-top: 16px; font-size: 36px; color: #f44336; }
      .buttons { margin-top: 48px; }
      .allow, .deny { background: unset; border: 1px solid #212121; padding: 16px 32px; margin-right: 32px; border-radius: 4px; cursor: pointer; }
      .allow:hover { background-color: #212121; }
      .deny { background-color: #d32f2f; }
      .deny:hover { background-color: #c62828; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="titlebar-container"></div>
      <div class="container-wrapper">
        <div class="container">
          <h1 class="title">Companion Authorization Request</h1>
          <p class="subtitle"><b class="app-name"></b> would like to control YtmRs</p>
          <p class="code-confirm">Please ensure the code below matches what <b class="app-name"></b> is showing</p>
          <p id="code" class="code"></p>
          <div class="buttons">
            <button class="deny" id="deny">Deny</button>
            <button class="allow" id="allow">Allow</button>
          </div>
        </div>
      </div>
    </div>
    <script src="/shared/titlebar.js"></script>
    <script>
      (async function () {
        createTitleBar(document.getElementById("titlebar-container"), {});
        const appName = await window.ytmd.getAppName();
        for (const el of document.querySelectorAll(".app-name")) el.textContent = appName;
        document.getElementById("code").textContent = await window.ytmd.getCode();
        document.getElementById("deny").addEventListener("click", () => window.ytmd.sendResult(false));
        document.getElementById("allow").addEventListener("click", () => window.ytmd.sendResult(true));
      })();
    </script>
  </body>
</html>
