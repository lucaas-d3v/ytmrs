<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>YtmRs - Changelog</title>
    <link rel="stylesheet" href="/shared/app.css" />
    <link rel="stylesheet" href="/shared/titlebar.css" />
    <style>
      #app { display: flex; flex-direction: column; }
      .changelog-container { flex: 1; overflow: auto; background: #000000; padding: 16px; }
      .updated-header { margin: 0; text-align: center; }
      .app-version { border-bottom: 1px solid #212121; padding-bottom: 8px; margin: 0; }
      .release-notes a { color: #bbbbbb; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="titlebar-container"></div>
      <div class="changelog-container">
        <h1 class="updated-header">YtmRs has Updated!</h1>
        <h2 id="app-version" class="app-version"></h2>
        <div id="release-notes" class="release-notes"></div>
      </div>
    </div>
    <script src="/shared/titlebar.js"></script>
    <script>
      (async function () {
        createTitleBar(document.getElementById("titlebar-container"), { title: "Changelog", icon: "news" });
        window.ytmd.requestWindowState();
        const metadata = await window.ytmd.getReleaseMetadata();
        document.getElementById("app-version").textContent = metadata.name;
        document.getElementById("release-notes").innerHTML = metadata.notesHtml || "";
      })();
    </script>
  </body>
</html>
