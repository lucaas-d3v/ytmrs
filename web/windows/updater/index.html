<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>YtmRs - Updater</title>
    <link rel="stylesheet" href="/shared/app.css" />
    <style>
      .app-updater-container { height: 100%; background-color: #000000; display: flex; flex-direction: column; justify-content: center; align-items: center; user-select: none; }
      .logo { width: 128px; height: 128px; margin-bottom: 16px; }
      .status-text { color: #969696; }
      .music-loader { display: flex; align-items: center; justify-content: center; gap: 8px; height: 80px; }
      .loader-line { width: 6px; height: 2px; border-radius: 10px; background-color: #ffffff; animation: musicloader 1.5s ease-in-out infinite; }
      .loader-line:nth-child(1), .loader-line:nth-child(8) { animation-delay: 1s; }
      .loader-line:nth-child(2), .loader-line:nth-child(7) { animation-delay: 0.8s; }
      .loader-line:nth-child(3), .loader-line:nth-child(6) { animation-delay: 0.4s; }
      .loader-line:nth-child(4), .loader-line:nth-child(5) { animation-delay: 0.2s; }
      @keyframes musicloader { 0% { height: 4px; } 50% { height: 56px; } 100% { height: 4px; } }
    </style>
  </head>
  <body>
    <div id="app" class="app-updater-container" data-app-region="drag">
      <img class="logo" draggable="false" src="/assets/icons/ytmrs.png" />
      <div class="music-loader">
        <div class="loader-line"></div><div class="loader-line"></div><div class="loader-line"></div><div class="loader-line"></div>
        <div class="loader-line"></div><div class="loader-line"></div><div class="loader-line"></div><div class="loader-line"></div>
      </div>
      <p id="status" class="status-text">Checking for updates...</p>
    </div>
    <script>
      (function () {
        const status = document.getElementById("status");
        const set = text => () => (status.textContent = text);
        const updater = window.ytmd.autoUpdater;
        updater.onChecking(set("Checking for updates..."));
        updater.onNotAvailable(set("No updates available"));
        updater.onAvailable(set("Downloading update..."));
        updater.onDownloaded(set("Restarting for update..."));
        updater.onError(set("Error checking for updates"));
      })();
    </script>
  </body>
</html>
