<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <title>YtmRs - Miniplayer</title>
    <link rel="stylesheet" href="/shared/app.css" />
    <link rel="stylesheet" href="./miniplayer.css" />
  </head>
  <body data-app-region="drag">
    <div id="app">
      <div class="topbar">
        <div class="backdrop"></div>
        <div class="button-container" data-app-region="no-drag">
          <button id="pin" class="pin">
            <span id="pin-icon" class="icon material-symbols-outlined">keep</span>
          </button>
          <button id="pip-exit" class="pip-exit" title="Close Miniplayer">
            <span class="icon material-symbols-outlined">pip_exit</span>
          </button>
        </div>
      </div>
      <div id="player" class="container" hidden>
        <div class="pusher"></div>
        <div class="video-data">
          <div class="backdrop"></div>
          <div id="info-container" class="video-info">
            <span id="info-title" class="title"></span>
          </div>
          <div id="seekbar-container" class="seekbar-container" data-app-region="no-drag">
            <div class="seekbar">
              <div id="progress" class="progress"></div>
              <div id="handle" class="handle" hidden></div>
            </div>
          </div>
          <div class="video-controls">
            <div class="padding"></div>
            <div class="controls">
              <button id="previous" data-app-region="no-drag"><span class="icon material-symbols-outlined">skip_previous</span></button>
              <button id="play-pause" data-app-region="no-drag"><span id="play-pause-icon" class="icon material-symbols-outlined">play_arrow</span></button>
              <button id="next" data-app-region="no-drag"><span class="icon material-symbols-outlined">skip_next</span></button>
            </div>
            <div class="controls right">
              <div class="volume" data-app-region="no-drag">
                <div id="volume-range" class="range-container slider">
                  <div id="volume-track" class="range">
                    <div class="range-background"></div>
                    <div id="volume-fill" class="range-fill"></div>
                    <div id="volume-handle" class="range-handle"></div>
                  </div>
                </div>
                <button id="mute"><span id="mute-icon" class="icon material-symbols-outlined">volume_up</span></button>
              </div>
              <button id="repeat" data-app-region="no-drag"><span id="repeat-icon" class="icon material-symbols-outlined">repeat</span></button>
            </div>
          </div>
        </div>
      </div>
      <div id="unavailable" class="container unavailable">
        <p>Video is still loading or no video loaded</p>
      </div>
    </div>
    <script src="./miniplayer.js"></script>
  </body>
</html>
