[package]
name = "ytmrs"
version = "2.1.0"
edition = "2021"
rust-version = "1.94"
description = "YtmRs - YouTube Music desktop app written in Rust (port of YTMDesktop)"
license = "GPL-3.0-only"
authors = ["NovusTheory <novustheory@gmail.com>"]
exclude = ["ytmdesktop/"]
build = "build.rs"

[[bin]]
name = "ytmrs"
path = "src/main.rs"

[dependencies]
# Windowing / webview (native system webview: WebKitGTK, WebView2, WKWebView)
tao = "0.37"
wry = { version = "0.57", features = ["devtools"] }
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
muda = "0.21"
global-hotkey = "0.9"
open = "5"
dpi = "0.1"

# Async / networking
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
socketioxide = { version = "0.18", features = ["extensions"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "form", "http2", "charset"] }
mdns-sd = "0.21"
hostname = "0.4"

# Data / util
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
semver = "1"
regex = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
sha2 = "0.10"
md-5 = "0.10"
aes-gcm = "0.10"
hex = "0.4"
chrono = "0.4"
log = "0.4"
fern = "0.7"
anyhow = "1"
parking_lot = "0.12"
notify = "8"
notify-rust = "4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"
comrak = { version = "0.59", default-features = false }
png = "0.18"
dirs = "7"
self-replace = "1"
http = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["common-controls-v6"] }
arboard = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Media",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_WinRT",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi",
] }
winreg = "0.55"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSView"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[package.metadata.deb]
name = "ytmrs"
maintainer = "lucaas-d3v"
section = "sound"
priority = "optional"
extended-description = "YouTube Music desktop app written in Rust (port of YTMDesktop) using the system WebKitGTK webview."
depends = "$auto"
recommends = "gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-libav"
assets = [
  ["target/release/ytmrs", "usr/bin/", "755"],
  ["packaging/linux/ytmrs.desktop", "usr/share/applications/app.ytmrs.YtmRs.desktop", "644"],
  ["assets/icons/hicolor/16x16.png", "usr/share/icons/hicolor/16x16/apps/ytmrs.png", "644"],
  ["assets/icons/hicolor/32x32.png", "usr/share/icons/hicolor/32x32/apps/ytmrs.png", "644"],
  ["assets/icons/hicolor/48x48.png", "usr/share/icons/hicolor/48x48/apps/ytmrs.png", "644"],
  ["assets/icons/hicolor/64x64.png", "usr/share/icons/hicolor/64x64/apps/ytmrs.png", "644"],
  ["assets/icons/hicolor/128x128.png", "usr/share/icons/hicolor/128x128/apps/ytmrs.png", "644"],
  ["assets/icons/hicolor/256x256.png", "usr/share/icons/hicolor/256x256/apps/ytmrs.png", "644"],
  ["assets/icons/hicolor/512x512.png", "usr/share/icons/hicolor/512x512/apps/ytmrs.png", "644"],
  ["README.md", "usr/share/doc/ytmrs/README.md", "644"],
]
